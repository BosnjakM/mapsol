<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0088ff" />
  <meta name="description" content="MAPSOL — Modern AI Platform Solutions. Webentwicklung und Workflow-Automatisierung aus Zürich für Ihr Unternehmen." />
  <meta name="keywords" content="Webentwicklung, Automatisierung, Website erstellen, Workflow-Automatisierung, Prozessautomatisierung, digitale Transformation, Softwareentwicklung, Schweiz, Zürich" />
  <meta name="author" content="MAPSOL" />
  <meta name="robots" content="index, follow" />
  <!-- Kein globales canonical hier: jede Seite setzt ihr eigenes (siehe scripts/prerender-heads.js + Helmet) -->
  <!-- Favicons (echte Dateien, damit Google das Logo anzeigt) -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="/favicon.svg" color="#0088ff" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>MAPSOL | Modern AI Platform Solutions</title>
  <!-- Google Analytics 4 (Seitenwechsel der React-App werden über "Erweiterte Messung" automatisch erfasst) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BTT2TM10V1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // Nur echte Besucher auf mapsol.ch zählen: nicht localhost, nicht /admin, nicht eigene Geräte.
    // Eigenes Gerät ausschliessen: einmal www.mapsol.ch/?intern=1 öffnen (wieder zählen: ?intern=0).
    try {
      if (/[?&]intern=1/.test(location.search)) localStorage.setItem('mapsol_intern', '1');
      if (/[?&]intern=0/.test(location.search)) localStorage.removeItem('mapsol_intern');
    } catch (e) {}
    var mapsolIntern = false;
    try { mapsolIntern = localStorage.getItem('mapsol_intern') === '1'; } catch (e) {}
    var mapsolLive = /(^|\.)mapsol\.ch$/.test(location.hostname);
    if (!mapsolLive || mapsolIntern || /^\/admin/.test(location.pathname)) {
      window['ga-disable-G-BTT2TM10V1'] = true;
    } else {
      gtag('config', 'G-BTT2TM10V1');
    }
    // Klicks auf Telefonnummer und E-Mail-Adresse als eigene Ereignisse messen
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="tel:"], a[href^="mailto:"]');
      if (!a || /^\/admin/.test(location.pathname)) return;
      var tel = a.getAttribute('href').indexOf('tel:') === 0;
      gtag('event', tel ? 'anruf_klick' : 'email_klick', { seite: location.pathname });
    });
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
